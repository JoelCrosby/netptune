# Mirrors charts/netptune/templates/httproute.yaml, api/httproute.yaml, website/httproute.yaml and
# middleware.yaml. Rendered as a Go template, so hosts, backends and secrets come from the edge resource's
# environment in AppHost.cs. Keep the routes and middlewares in step with the chart.
#
# edge-authorization stands in for the Cloudflare Transform Rule: it stamps the edge secret on every request,
# so a CF-Connecting-IP header sent through this proxy is believed the same way it is behind Cloudflare.
http:
  routers:
    root-api-v1:
      entryPoints: [web]
      rule: 'Host(`{{ env "ROOT_HOST" }}`) && PathPrefix(`/api/v1`)'
      middlewares: [edge-authorization, security-headers, body-size-limit, compress]
      service: api
    root-hubs:
      entryPoints: [web]
      rule: 'Host(`{{ env "ROOT_HOST" }}`) && PathPrefix(`/api/hubs/`)'
      middlewares: [edge-authorization, security-headers]
      service: app
    root-ai:
      entryPoints: [web]
      rule: 'Host(`{{ env "ROOT_HOST" }}`) && PathPrefix(`/api/ai/`)'
      middlewares: [edge-authorization, security-headers, compress]
      service: app
    root-api:
      entryPoints: [web]
      rule: 'Host(`{{ env "ROOT_HOST" }}`) && PathPrefix(`/api/`)'
      middlewares: [edge-authorization, security-headers, body-size-limit, compress]
      service: app
    root:
      entryPoints: [web]
      rule: 'Host(`{{ env "ROOT_HOST" }}`) && PathPrefix(`/`)'
      middlewares: [edge-authorization, security-headers]
      service: website

    app-api-v1:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_HOST" }}`) && PathPrefix(`/api/v1`)'
      middlewares: [edge-authorization, security-headers, body-size-limit, compress]
      service: api
    app-hubs:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_HOST" }}`) && PathPrefix(`/api/hubs/`)'
      middlewares: [edge-authorization, security-headers]
      service: app
    app-ai:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_HOST" }}`) && PathPrefix(`/api/ai/`)'
      middlewares: [edge-authorization, security-headers, compress]
      service: app
    app-api:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_HOST" }}`) && PathPrefix(`/api/`)'
      middlewares: [edge-authorization, security-headers, body-size-limit, compress]
      service: app
    app:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_HOST" }}`) && PathPrefix(`/`)'
      middlewares: [edge-authorization, security-headers]
      service: client

    api:
      entryPoints: [web]
      rule: 'Host(`{{ env "API_HOST" }}`) && PathPrefix(`/`)'
      middlewares: [edge-authorization, api-security-headers, body-size-limit]
      service: api

    website:
      entryPoints: [web]
      rule: 'Host(`{{ env "WEBSITE_HOST" }}`) && PathPrefix(`/`)'
      middlewares: [edge-authorization, body-size-limit]
      service: website

  middlewares:
    edge-authorization:
      headers:
        customRequestHeaders:
          '{{ env "EDGE_AUTHORIZATION_HEADER" }}': '{{ env "EDGE_AUTHORIZATION_SECRET" }}'
    security-headers:
      headers:
        customResponseHeaders:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains"
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          Content-Security-Policy: "default-src 'self'; script-src 'self' '{{ env "CSP_INLINE_SCRIPT_HASH" }}' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' {{ env "APP_ORIGIN" }}; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';"
    api-security-headers:
      headers:
        customResponseHeaders:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains"
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
    body-size-limit:
      buffering:
        maxRequestBodyBytes: 52428800
    compress:
      compress:
        minResponseBodyBytes: 1024
        excludedContentTypes:
          - "text/event-stream"

  services:
    app:
      loadBalancer:
        servers:
          - url: '{{ env "APP_URL" }}'
    api:
      loadBalancer:
        servers:
          - url: '{{ env "API_URL" }}'
    client:
      loadBalancer:
        servers:
          - url: '{{ env "CLIENT_URL" }}'
    website:
      loadBalancer:
        servers:
          - url: '{{ env "WEBSITE_URL" }}'
