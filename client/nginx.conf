# Rendered by the nginx image's 20-envsubst-on-templates.sh into
# /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes inside
# http{} — so the map blocks below are in a legal context here.
#
# envsubst only substitutes names that exist in the environment (API_URL and the
# other client ConfigMap values), so nginx's own $uri, $scheme, $http_*, $cookie_*
# and capture variables pass through untouched.
#
# Layout: en-GB is the source locale and is served from / (angular.json sets its
# i18n subPath to ""), so existing URLs and bookmarks keep working untouched.
# fr/de/es live in /fr/, /de/, /es/.

# Accept-Language -> supported locale. Regexes are tried in declaration order and
# first match wins, so en-gb must precede the bare en.
map $http_accept_language $locale_from_header {
    default   "en-GB";
    ~*^en-gb  "en-GB";
    ~*^fr     "fr";
    ~*^de     "de";
    ~*^es     "es";
    ~*^en     "en-GB";
}

# Explicit user choice, set by the in-app locale switcher. Allow-listed so a
# hostile cookie value cannot steer the redirect at a path we do not serve.
map $cookie_nt_locale $locale_from_cookie {
    default   "";
    "en-GB"   "en-GB";
    "fr"      "fr";
    "de"      "de";
    "es"      "es";
}

# The cookie wins over Accept-Language when it holds a supported locale.
map $locale_from_cookie $preferred_locale {
    ""        $locale_from_header;
    default   $locale_from_cookie;
}

# URL prefix for the preferred locale. Empty for en-GB, which is served from the
# root — that is what makes unprefixed URLs a no-redirect path for English users.
map $preferred_locale $locale_prefix {
    default   "";
    "fr"      "/fr";
    "de"      "/de";
    "es"      "/es";
}

server {
    # Defaulted to 80 by ENV in the Dockerfile, so production is unchanged. Override
    # it (with host networking) to run against a host-local API from a rootless
    # container, which cannot bind a privileged port.
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain
      text/css
      application/json
      application/javascript
      text/xml
      application/xml
      application/xml+rss
      text/javascript;

    gzip_min_length 1024;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness/readiness target: no redirect, no dependence on Accept-Language.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # proxy /api to backend — API_URL injected at runtime by Aspire / Docker.
    # Never locale-prefixed.
    location /api/ {
        set $forwarded_proto $scheme;

        if ($http_x_forwarded_proto != "") {
            set $forwarded_proto $http_x_forwarded_proto;
        }

        proxy_pass ${API_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Locale-independent, and referenced with root-absolute paths from index.html
    # and site.webmanifest. Served straight from the root copy so a non-English
    # visitor does not pay a redirect for every icon. ^~ stops regex matching, so
    # the caching headers have to be repeated here.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # en-GB has no URL prefix, so fold away any /en-GB/... that a stale link or
    # bookmark still points at. ^~ keeps the regex locations below from matching.
    location ^~ /en-GB {
        rewrite ^/en-GB/?(.*)$ /$1 permanent;
    }

    # No-store on the documents so deployments are picked up at once. These must
    # precede the locale fallback, or it would match first and lose the header.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ ^/(?:fr|de|es)/index\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static assets (Angular outputs content-hashed filenames). Precedes the
    # locale fallback so /fr/main-ABC123.js is served immutable, and precedes the
    # catch-all so asset requests are never redirected to another locale.
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|png|jpg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # /fr -> /fr/
    location ~ ^/(fr|de|es)$ {
        return 301 /$1/;
    }

    # Per-locale SPA fallback.
    location ~ ^/(fr|de|es)/ {
        try_files $uri $uri/ /$1/index.html;
    }

    # Entry point and every unprefixed URL: "/", bookmarks, and the
    # password-reset / e-mail-confirm / workspace-invite links and OAuth callbacks
    # that the API generates without a locale prefix. English visitors are served
    # in place; others are moved to their locale so the link opens in their
    # language. `if` is used only to `return`, which is the supported form.
    #
    # There is deliberately no `location = /` — the trailing /index.html here is
    # an internal redirect, which re-enters location matching and so picks up the
    # no-store header above. Serving it via `try_files /index.html =404` in an
    # exact-match block would bypass that and leave "/" with no Cache-Control.
    location / {
        if ($locale_prefix != "") {
            return 302 $locale_prefix$uri$is_args$args;
        }

        try_files $uri $uri/ /index.html;
    }
}
