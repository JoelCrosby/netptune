<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netptune</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      (function () {
        var theme = null;

        try {
          var cached = JSON.parse(
            localStorage.getItem('Netptune-settings.theme')
          );
          if (cached === 'light' || cached === 'dark') {
            theme = cached;
          }
        } catch (e) {
        }

        if (!theme) {
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;

          theme = prefersDark ? 'dark' : 'light';
        }

        document.documentElement.classList.add(theme);
      })();
    </script>

    <style>
      html.light {
        color-scheme: light;
        background: #fafafb;
      }

      html.dark {
        color-scheme: dark;
        background: #000;
      }

      #app-loader {
        --loader-surface: var(--background, #fafafb);
        --loader-accent: var(--primary, #673ab7);

        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--loader-surface);
        transition: opacity 200ms ease-out;
      }

      html.dark #app-loader {
        --loader-surface: var(--background, #000);
        --loader-accent: var(--primary, #b39ddb);
      }

      #app-loader.app-loader-dismissed {
        opacity: 0;
      }

      .app-loader-spinner {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(
          to right,
          var(--loader-accent) 10%,
          rgba(129, 55, 241, 0) 42%
        );
        animation: app-loader-spin 1.4s infinite linear;
      }

      .app-loader-spinner::before,
      .app-loader-spinner::after {
        content: '';
        position: absolute;
      }

      .app-loader-spinner::before {
        top: 0;
        left: 0;
        width: 50%;
        height: 50%;
        border-radius: 100% 0 0;
        background: var(--loader-accent);
      }

      .app-loader-spinner::after {
        inset: 0;
        width: 75%;
        height: 75%;
        margin: auto;
        border-radius: 50%;
        background: var(--loader-surface);
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader-spinner {
          animation-duration: 3s;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      rel="preconnect"
      href="https://netptune.s3.eu-west-2.amazonaws.com/" />

    <link rel="preconnect" href="https://challenges.cloudflare.com" />

    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png" />
    <link
      rel="mask-icon"
      href="/assets/safari-pinned-tab.svg"
      color="#673AB7" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:title" content="Netptune" />
    <meta name="title" content="Netptune" />
    <meta property="twitter:title" content="Netptune" />

    <meta
      name="description"
      content="Project managament for software development teams" />
    <meta
      property="og:description"
      content="Project managament for software development teams" />
    <meta
      property="twitter:description"
      content="Project managament for software development teams" />

    <meta name="image" content="/assets/android-chrome-512x512.png" />
    <meta property="og:image" content="/assets/android-chrome-512x512.png" />
    <meta
      property="twitter:image"
      content="/assets/android-chrome-512x512.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Mono|Material+Icons|Material+Icons+Outlined|Material+Icons+Round"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Loading">
      <div class="app-loader-spinner"></div>
    </div>

    <app-root></app-root>
  </body>
</html>
