name: Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - "server/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Netptune.slnx

      - name: Build
        run: dotnet build Netptune.slnx --no-restore --configuration Release

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Netptune.UnitTests/Netptune.UnitTests.csproj

      - name: Build
        run: dotnet build Netptune.UnitTests/Netptune.UnitTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project Netptune.UnitTests/Netptune.UnitTests.csproj --no-build --configuration Release

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Netptune.IntegrationTests/Netptune.IntegrationTests.csproj

      - name: Build
        run: dotnet build Netptune.IntegrationTests/Netptune.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project Netptune.IntegrationTests/Netptune.IntegrationTests.csproj --no-build --configuration Release

  automation-tests:
    name: Automation Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Netptune.Automation.Tests/Netptune.Automation.Tests.csproj

      - name: Build
        run: dotnet build Netptune.Automation.Tests/Netptune.Automation.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project Netptune.Automation.Tests/Netptune.Automation.Tests.csproj --no-build --configuration Release
