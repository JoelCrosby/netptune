name: Deploy

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild and redeploy every image regardless of what changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "website/**"
      - "charts/netptune/**"
      - ".github/workflows/deploy-charts.yml"

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  # Image names are built from changes.outputs.owner, which is lowercased —
  # github.repository_owner is not, and OCI repository names must be.
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      website: ${{ steps.filter.outputs.website }}
      charts: ${{ steps.filter.outputs.charts }}
      deploy: ${{ steps.filter.outputs.deploy }}
      server_sha: ${{ steps.filter.outputs.server_sha }}
      client_sha: ${{ steps.filter.outputs.client_sha }}
      website_sha: ${{ steps.filter.outputs.website_sha }}
      owner: ${{ steps.filter.outputs.owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi

          server=false
          client=false
          website=false
          charts=false

          while IFS= read -r path; do
            case "$path" in
              server/*) server=true ;;
              client/*) client=true ;;
              website/*) website=true ;;
              charts/netptune/*) charts=true ;;
            esac
          done < <(git diff --name-only "$before" "$after")

          # A manual run with force_build rebuilds and redeploys everything, which is how
          # images get rebuilt when only the workflow or charts changed.
          if [[ "${{ inputs.force_build }}" == "true" ]]; then
            server=true
            client=true
            website=true
          fi

          deploy=false
          if [[ "$server" == true || "$client" == true || "$website" == true || "$charts" == true ]]; then
            deploy=true
          fi

          # Images are tagged with the last commit that touched their source, not with the
          # head of the push. A push batching several commits leaves the source commit off
          # the head, so tagging by github.sha produced tags the deploy could never resolve.
          # Build and deploy both read the values below, so they agree by construction.
          #
          # OCI repository names must be lowercase and github.repository_owner is not
          # (JoelCrosby); metadata-action lowercases silently but helm --set does not.
          {
            echo "server=$server"
            echo "client=$client"
            echo "website=$website"
            echo "charts=$charts"
            echo "deploy=$deploy"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "server_sha=sha-$(git log -1 --format=%H -- server/)"
            echo "client_sha=sha-$(git log -1 --format=%H -- client/)"
            echo "website_sha=sha-$(git log -1 --format=%H -- website/)"
          } >> "$GITHUB_OUTPUT"

  test-server:
    name: Test Server
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore unit tests
        run: dotnet restore Netptune.UnitTests/Netptune.UnitTests.csproj

      - name: Build unit tests
        run: dotnet build Netptune.UnitTests/Netptune.UnitTests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --project Netptune.UnitTests/Netptune.UnitTests.csproj --no-build --configuration Release

      - name: Restore integration tests
        run: dotnet restore Netptune.IntegrationTests/Netptune.IntegrationTests.csproj

      - name: Build integration tests
        run: dotnet build Netptune.IntegrationTests/Netptune.IntegrationTests.csproj --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test --project Netptune.IntegrationTests/Netptune.IntegrationTests.csproj --no-build --configuration Release

  build-app:
    name: Build App Image
    needs: [changes, test-server]
    if: ${{ always() && needs.changes.outputs.server == 'true' && needs.test-server.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.App/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-jobs:
    name: Build Jobs Image
    needs: [changes, test-server]
    if: ${{ always() && needs.changes.outputs.server == 'true' && needs.test-server.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-jobs
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.JobServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-public-api:
    name: Build Public API Image
    needs: [changes, test-server]
    if: ${{ always() && needs.changes.outputs.server == 'true' && needs.test-server.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-public-api
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.PublicApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-activity:
    name: Build Activity Image
    needs: [changes, test-server]
    if: ${{ always() && needs.changes.outputs.server == 'true' && needs.test-server.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-activity
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.ActivityServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client:
    name: Build Client Image
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-client
          tags: |
            type=raw,value=${{ needs.changes.outputs.client_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-website:
    name: Build Website Image
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-website
          tags: |
            type=raw,value=${{ needs.changes.outputs.website_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./website
          file: website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [changes, test-server, build-app, build-public-api, build-jobs, build-activity, build-client, build-website]
    if: |
      ${{
        always() &&
        needs.changes.outputs.deploy == 'true' &&
        (needs.test-server.result == 'success' || needs.test-server.result == 'skipped') &&
        (needs.build-app.result == 'success' || needs.build-app.result == 'skipped') &&
        (needs.build-public-api.result == 'success' || needs.build-public-api.result == 'skipped') &&
        (needs.build-jobs.result == 'success' || needs.build-jobs.result == 'skipped') &&
        (needs.build-activity.result == 'success' || needs.build-activity.result == 'skipped') &&
        (needs.build-client.result == 'success' || needs.build-client.result == 'skipped') &&
        (needs.build-website.result == 'success' || needs.build-website.result == 'skipped')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify images exist
        run: |
          # Helm reports a missing image as six deployments timing out after ten minutes.
          # Checking the manifests first turns that into an immediate, legible failure.
          owner="${{ needs.changes.outputs.owner }}"
          for ref in \
            "netptune:${{ needs.changes.outputs.server_sha }}" \
            "netptune-public-api:${{ needs.changes.outputs.server_sha }}" \
            "netptune-jobs:${{ needs.changes.outputs.server_sha }}" \
            "netptune-activity:${{ needs.changes.outputs.server_sha }}" \
            "netptune-client:${{ needs.changes.outputs.client_sha }}" \
            "netptune-website:${{ needs.changes.outputs.website_sha }}"; do
            repo="${ref%%:*}"
            tag="${ref##*:}"
            token="$(curl -fsSL "https://ghcr.io/token?scope=repository:$owner/$repo:pull&service=ghcr.io" | jq -r .token)"
            status="$(curl -sSL -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/$owner/$repo/manifests/$tag")"
            if [[ "$status" != "200" ]]; then
              echo "::error::ghcr.io/$owner/$repo:$tag is missing (HTTP $status). Re-run with force_build to rebuild it."
              exit 1
            fi
            echo "ok ghcr.io/$owner/$repo:$tag"
          done

      - name: Verify CSP inline script hash
        run: |
          # A stale hash fails silently in the browser, so fail the deploy instead.
          python3 - <<'PY'
          import base64, hashlib, re, sys

          html = open('client/src/index.html', encoding='utf-8').read()
          inline = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)

          if len(inline) != 1:
              sys.exit(f'expected exactly one inline script in index.html, found {len(inline)}')

          digest = base64.b64encode(hashlib.sha256(inline[0].encode()).digest()).decode()
          expected = f'sha256-{digest}'

          values = open('charts/netptune/values.yaml', encoding='utf-8').read()

          if expected not in values:
              sys.exit(f'csp.inlineScriptHash in values.yaml is stale; expected {expected}')

          print(f'CSP inline script hash matches: {expected}')
          PY

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Write kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" > kubeconfig.yaml

      - name: Deploy
        run: |
          helm upgrade --install netptune-app charts/netptune/ \
            --rollback-on-failure \
            --wait \
            --timeout 10m \
            --kubeconfig kubeconfig.yaml \
            --namespace default \
            --set "parameters.api.api_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.publicApi.public_api_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-public-api:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.jobs.jobs_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-jobs:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.activity.activity_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-activity:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.client.client_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-client:${{ needs.changes.outputs.client_sha }}" \
            --set "website.image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-website:${{ needs.changes.outputs.website_sha }}" \
            --set ingress.enabled=true \
            --set "ingress.host=netptune.co.uk" \
            --set "ingress.publicApiHost=api.netptune.co.uk" \
            --set ingress.tls.enabled=true \
            --set "ingress.tls.email=${{ secrets.TLS_EMAIL }}" \
            --set "parameters.client.api_url=http://api-service:7400" \
            --set "secrets.postgres.postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --set "secrets.meilisearch.master_key=${{ secrets.NETPTUNE_MEILISEARCH_MASTER_KEY }}" \
            --set "secrets.cache.cache_password=${{ secrets.CACHE_PASSWORD }}" \
            --set "secrets.api.cache_password=${{ secrets.CACHE_PASSWORD }}" \
            --set "secrets.api.postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --set "secrets.api.signing_key=${{ secrets.SIGNING_KEY }}" \
            --set "secrets.api.github_client_id=${{ secrets.NETPTUNE_GITHUB_CLIENT_ID }}" \
            --set "secrets.api.github_secret=${{ secrets.NETPTUNE_GITHUB_SECRET }}" \
            --set "secrets.api.github_callback=${{ secrets.NETPTUNE_GITHUB_CALLBACK }}" \
            --set "secrets.api.google_client_id=${{ secrets.NETPTUNE_GOOGLE_CLIENT_ID }}" \
            --set "secrets.api.google_secret=${{ secrets.NETPTUNE_GOOGLE_SECRET }}" \
            --set "secrets.api.google_callback=${{ secrets.NETPTUNE_GOOGLE_CALLBACK }}" \
            --set "secrets.api.microsoft_client_id=${{ secrets.NETPTUNE_MICROSOFT_CLIENT_ID }}" \
            --set "secrets.api.microsoft_secret=${{ secrets.NETPTUNE_MICROSOFT_SECRET }}" \
            --set "secrets.api.microsoft_callback=${{ secrets.NETPTUNE_MICROSOFT_CALLBACK }}" \
            --set "secrets.api.sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
            --set "secrets.api.s3_bucket_name=${{ secrets.S3_BUCKET_NAME }}" \
            --set "secrets.api.s3_region=${{ secrets.S3_REGION }}" \
            --set "secrets.api.s3_access_key_id=${{ secrets.S3_ACCESS_KEY_ID }}" \
            --set "secrets.api.s3_secret_access_key=${{ secrets.S3_SECRET_ACCESS_KEY }}" \
            --set "secrets.api.turnstile_secret_key=${{ secrets.NETPTUNE_TURNSTILE_SECRET_KEY }}" \
            --set "secrets.api.cloudflare_email_token=${{ secrets.NETPTUNE_CLOUDFLARE_EMAIL_TOKEN }}" \
            --set "secrets.api.cloudflare_account_id=${{ secrets.NETPTUNE_CLOUDFLARE_ACCOUNT_ID }}" \
            --set "secrets.publicApi.cache_password=${{ secrets.CACHE_PASSWORD }}" \
            --set "secrets.publicApi.postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --set "secrets.jobs.cache_password=${{ secrets.CACHE_PASSWORD }}" \
            --set "secrets.jobs.postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --set "secrets.jobs.signing_key=${{ secrets.SIGNING_KEY }}" \
            --set "secrets.jobs.sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
            --set "secrets.jobs.s3_bucket_name=${{ secrets.S3_BUCKET_NAME }}" \
            --set "secrets.jobs.s3_region=${{ secrets.S3_REGION }}" \
            --set "secrets.jobs.s3_access_key_id=${{ secrets.S3_ACCESS_KEY_ID }}" \
            --set "secrets.jobs.s3_secret_access_key=${{ secrets.S3_SECRET_ACCESS_KEY }}" \
            --set "secrets.jobs.cloudflare_email_token=${{ secrets.NETPTUNE_CLOUDFLARE_EMAIL_TOKEN }}" \
            --set "secrets.jobs.cloudflare_account_id=${{ secrets.NETPTUNE_CLOUDFLARE_ACCOUNT_ID }}" \
            --set "secrets.activity.cache_password=${{ secrets.CACHE_PASSWORD }}" \
            --set "secrets.activity.postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --set "secrets.activity.signing_key=${{ secrets.SIGNING_KEY }}" \
            --set "secrets.activity.s3_bucket_name=${{ secrets.S3_BUCKET_NAME }}" \
            --set "secrets.activity.s3_region=${{ secrets.S3_REGION }}" \
            --set "secrets.activity.s3_access_key_id=${{ secrets.S3_ACCESS_KEY_ID }}" \
            --set "secrets.activity.s3_secret_access_key=${{ secrets.S3_SECRET_ACCESS_KEY }}" \
            --set "secrets.headlamp.github_client_id=${{ secrets.HEADLAMP_GITHUB_CLIENT_ID }}" \
            --set "secrets.headlamp.github_client_secret=${{ secrets.HEADLAMP_GITHUB_CLIENT_SECRET }}" \
            --set "secrets.headlamp.cookie_secret=${{ secrets.HEADLAMP_COOKIE_SECRET }}" \
            --set "secrets.dbgate.github_client_id=${{ secrets.DBGATE_GITHUB_CLIENT_ID }}" \
            --set "secrets.dbgate.github_client_secret=${{ secrets.DBGATE_GITHUB_CLIENT_SECRET }}" \
            --set "secrets.dbgate.cookie_secret=${{ secrets.DBGATE_COOKIE_SECRET }}" \
            --set "secrets.aspire.github_client_id=${{ secrets.ASPIRE_GITHUB_CLIENT_ID }}" \
            --set "secrets.aspire.github_client_secret=${{ secrets.ASPIRE_GITHUB_CLIENT_SECRET }}" \
            --set "secrets.aspire.cookie_secret=${{ secrets.ASPIRE_COOKIE_SECRET }}" \
            --set "secrets.aspire.otlp_api_key=${{ secrets.ASPIRE_OTLP_API_KEY }}"

