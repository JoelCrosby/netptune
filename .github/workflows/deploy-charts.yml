name: Deploy

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild every image. Leave off to redeploy the current images, e.g. after changing prod secrets"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "website/**"
      - "charts/netptune/**"
      - ".github/workflows/deploy-charts.yml"

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  # Image names are built from changes.outputs.owner, which is lowercased —
  # github.repository_owner is not, and OCI repository names must be.
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      website: ${{ steps.filter.outputs.website }}
      charts: ${{ steps.filter.outputs.charts }}
      deploy: ${{ steps.filter.outputs.deploy }}
      server_sha: ${{ steps.filter.outputs.server_sha }}
      client_sha: ${{ steps.filter.outputs.client_sha }}
      website_sha: ${{ steps.filter.outputs.website_sha }}
      owner: ${{ steps.filter.outputs.owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi

          server=false
          client=false
          website=false
          charts=false

          while IFS= read -r path; do
            case "$path" in
              server/*) server=true ;;
              client/*) client=true ;;
              website/*) website=true ;;
              charts/netptune/*) charts=true ;;
            esac
          done < <(git diff --name-only "$before" "$after")

          # A manual run has no previous commit to diff against, so without force_build it
          # redeploys the current images. That is how prod secret changes, which live in the
          # private netptune-secrets repo and trigger nothing here, are applied.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            server=false
            client=false
            website=false
            charts=true
          fi

          # A manual run with force_build rebuilds and redeploys everything, which is how
          # images get rebuilt when only the workflow or charts changed.
          if [[ "${{ inputs.force_build }}" == "true" ]]; then
            server=true
            client=true
            website=true
          fi

          deploy=false
          if [[ "$server" == true || "$client" == true || "$website" == true || "$charts" == true ]]; then
            deploy=true
          fi

          # Images are tagged with the last commit that touched their source, not with the
          # head of the push. A push batching several commits leaves the source commit off
          # the head, so tagging by github.sha produced tags the deploy could never resolve.
          # Build and deploy both read the values below, so they agree by construction.
          #
          # OCI repository names must be lowercase and github.repository_owner is not
          # (JoelCrosby); metadata-action lowercases silently but helm --set does not.
          {
            echo "server=$server"
            echo "client=$client"
            echo "website=$website"
            echo "charts=$charts"
            echo "deploy=$deploy"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "server_sha=sha-$(git log -1 --format=%H -- server/)"
            echo "client_sha=sha-$(git log -1 --format=%H -- client/)"
            echo "website_sha=sha-$(git log -1 --format=%H -- website/)"
          } >> "$GITHUB_OUTPUT"

  test-server:
    name: Test Server
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    uses: ./.github/workflows/test.yml

  build-app:
    name: Build App Image
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.App/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}

  build-jobs:
    name: Build Jobs Image
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-jobs
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.JobServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}

  build-api:
    name: Build API Image
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-api
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}

  build-activity:
    name: Build Activity Image
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-activity
          tags: |
            type=raw,value=${{ needs.changes.outputs.server_sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Netptune.ActivityServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}

  build-client:
    name: Build Client Image
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-client
          tags: |
            type=raw,value=${{ needs.changes.outputs.client_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
            RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  build-website:
    name: Build Website Image
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(date '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-website
          tags: |
            type=raw,value=${{ needs.changes.outputs.website_sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./website
          file: website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_NUMBER=${{ steps.build_number.outputs.value }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max

  deploy:
    name: Deploy
    needs: [changes, test-server, build-app, build-api, build-jobs, build-activity, build-client, build-website]
    if: |
      ${{
        always() &&
        needs.changes.outputs.deploy == 'true' &&
        (needs.test-server.result == 'success' || needs.test-server.result == 'skipped') &&
        (needs.build-app.result == 'success' || needs.build-app.result == 'skipped') &&
        (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
        (needs.build-jobs.result == 'success' || needs.build-jobs.result == 'skipped') &&
        (needs.build-activity.result == 'success' || needs.build-activity.result == 'skipped') &&
        (needs.build-client.result == 'success' || needs.build-client.result == 'skipped') &&
        (needs.build-website.result == 'success' || needs.build-website.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify images exist
        run: |
          # Helm reports a missing image as six deployments timing out after ten minutes.
          # Checking the manifests first turns that into an immediate, legible failure.
          owner="${{ needs.changes.outputs.owner }}"
          for ref in \
            "netptune:${{ needs.changes.outputs.server_sha }}" \
            "netptune-api:${{ needs.changes.outputs.server_sha }}" \
            "netptune-jobs:${{ needs.changes.outputs.server_sha }}" \
            "netptune-activity:${{ needs.changes.outputs.server_sha }}" \
            "netptune-client:${{ needs.changes.outputs.client_sha }}" \
            "netptune-website:${{ needs.changes.outputs.website_sha }}"; do
            repo="${ref%%:*}"
            tag="${ref##*:}"
            token="$(curl -fsSL "https://ghcr.io/token?scope=repository:$owner/$repo:pull&service=ghcr.io" | jq -r .token)"
            status="$(curl -sSL -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/$owner/$repo/manifests/$tag")"
            if [[ "$status" != "200" ]]; then
              echo "::error::ghcr.io/$owner/$repo:$tag is missing (HTTP $status). Re-run with force_build to rebuild it."
              exit 1
            fi
            echo "ok ghcr.io/$owner/$repo:$tag"
          done

      - name: Log in to GitHub Container Registry
        if: ${{ needs.changes.outputs.server == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server images build while the tests run, so they are pushed with only their commit tag
      # and only get the branch and latest tags once the tests have passed.
      - name: Tag server images
        if: ${{ needs.changes.outputs.server == 'true' }}
        run: |
          for repo in netptune netptune-api netptune-jobs netptune-activity; do
            image="${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/$repo"
            docker buildx imagetools create \
              --tag "$image:${{ github.ref_name }}" \
              --tag "$image:latest" \
              "$image:${{ needs.changes.outputs.server_sha }}"
          done

      - name: Verify CSP inline script hash
        run: |
          # A stale hash fails silently in the browser, so fail the deploy instead.
          python3 - <<'PY'
          import base64, hashlib, re, sys

          html = open('client/src/index.html', encoding='utf-8').read()
          inline = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)

          if len(inline) != 1:
              sys.exit(f'expected exactly one inline script in index.html, found {len(inline)}')

          digest = base64.b64encode(hashlib.sha256(inline[0].encode()).digest()).decode()
          expected = f'sha256-{digest}'

          values = open('charts/netptune/values.yaml', encoding='utf-8').read()

          if expected not in values:
              sys.exit(f'csp.inlineScriptHash in values.yaml is stale; expected {expected}')

          print(f'CSP inline script hash matches: {expected}')
          PY

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Write kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" > kubeconfig.yaml

      - name: Install sops
        env:
          SOPS_VERSION: "3.13.3"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check out prod secrets
        uses: actions/checkout@v6
        with:
          repository: JoelCrosby/netptune-secrets
          ssh-key: ${{ secrets.SECRETS_REPO_DEPLOY_KEY }}
          path: prod-secrets
          persist-credentials: false

      - name: Decrypt prod values
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops --decrypt prod-secrets/secrets.prod.enc.yaml > "$RUNNER_TEMP/secrets.prod.yaml"

      # A value left empty in the file would otherwise surface as a pod failing options validation
      # halfway through the rollout.
      - name: Check prod values
        run: |
          empty="$(yq '.. | select(tag == "!!str" and . == "") | path | join(".")' "$RUNNER_TEMP/secrets.prod.yaml")"

          if [[ -n "$empty" ]]; then
            echo "::error::Empty values in netptune-secrets/secrets.prod.enc.yaml:"
            echo "$empty"
            exit 1
          fi

      - name: Set up .NET
        if: ${{ needs.changes.outputs.server == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      # The target schema comes from the EF model at this commit, the same DDL EnsureCreated runs.
      - name: Generate database schema
        if: ${{ needs.changes.outputs.server == 'true' }}
        working-directory: server
        run: |
          ef_version="$(grep -oP 'Include="Microsoft.EntityFrameworkCore.Design" Version="\K[^"]+' Directory.Packages.props)"
          dotnet tool install --global dotnet-ef --version "$ef_version"
          dotnet ef dbcontext script -p Netptune.Entities -s Netptune.Entities -o "$RUNNER_TEMP/schema.sql"

          # EF writes a byte order mark, which Postgres rejects as a syntax error.
          sed -i '1s/^\xEF\xBB\xBF//' "$RUNNER_TEMP/schema.sql"

      - name: Install Atlas
        if: ${{ needs.changes.outputs.server == 'true' }}
        env:
          ATLAS_VERSION: "v1.3.0"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/atlas" \
            "https://release.ariga.io/atlas/atlas-community-linux-amd64-${ATLAS_VERSION}"
          chmod +x "$RUNNER_TEMP/atlas"

      # Only changes the previous release can keep running against are applied here. Old pods keep
      # serving until the rollout finishes and a failed rollout rolls back the code but not the schema,
      # so drops, type changes, required columns and new constraints on existing tables would break
      # whichever code is running. scripts/check-schema-plan.sh lists what has to be applied by hand.
      - name: Migrate database schema
        if: ${{ needs.changes.outputs.server == 'true' }}
        run: |
          password="$(yq '.secrets.postgres.postgres_password' "$RUNNER_TEMP/secrets.prod.yaml")"
          encoded="$(jq -rn --arg p "$password" '$p | @uri')"
          echo "::add-mask::$password"
          echo "::add-mask::$encoded"

          kubectl --kubeconfig kubeconfig.yaml port-forward pod/postgres-statefulset-0 5433:5432 -n default >/dev/null 2>&1 &
          port_forward=$!
          trap 'kill "$port_forward"' EXIT

          for _ in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null && break
            sleep 1
          done

          prod_url="postgres://postgres:${encoded}@127.0.0.1:5433/netptune?sslmode=disable&search_path=public"
          dev_url="docker://postgres/18/dev?search_path=public"
          schema="file://$RUNNER_TEMP/schema.sql"
          plan="$RUNNER_TEMP/schema-plan.sql"

          atlas schema diff --from "$prod_url" --to "$schema" --dev-url "$dev_url" > "$plan"

          if grep -qx 'Schemas are synced, no changes to be made.' "$plan"; then
            echo "Database schema is up to date"
            exit 0
          fi

          {
            echo "### Database schema changes"
            echo '```sql'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$plan"

          if ! unsafe="$(scripts/check-schema-plan.sh "$plan")"; then
            echo "::error::The schema plan has changes the running release can't work against. Review them in the job summary and apply them by hand, then re-run this job. Drops, type changes and renames can go through scripts/atlas-migrate.ts --apply. Required columns on existing tables need a model default (HasDefaultValue) or hand-written SQL that backfills them, and SET NOT NULL or a new unique index needs the existing rows checked first."
            echo "$unsafe"
            exit 1
          fi

          atlas schema apply --url "$prod_url" --to "$schema" --dev-url "$dev_url" --auto-approve

      - name: Deploy
        run: |
          helm upgrade --install netptune-app charts/netptune/ \
            --rollback-on-failure \
            --wait \
            --timeout 10m \
            --kubeconfig kubeconfig.yaml \
            --namespace default \
            --values "$RUNNER_TEMP/secrets.prod.yaml" \
            --set "parameters.app.app_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.api.api_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-api:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.jobs.jobs_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-jobs:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.activity.activity_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-activity:${{ needs.changes.outputs.server_sha }}" \
            --set "parameters.client.client_image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-client:${{ needs.changes.outputs.client_sha }}" \
            --set "website.image=${{ env.REGISTRY }}/${{ needs.changes.outputs.owner }}/netptune-website:${{ needs.changes.outputs.website_sha }}" \
            --set ingress.enabled=true \
            --set "ingress.host=netptune.co.uk" \
            --set "ingress.apiHost=api.netptune.co.uk" \
            --set ingress.tls.enabled=true \
            --set "parameters.client.api_url=http://app-service:7400"

