name: Lint Client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "client/**"
      - ".github/workflows/lint-client.yml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check translation catalogues
        run: pnpm i18n:check
