---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "postgres-statefulset"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "postgres"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "netptune-app"
      app.kubernetes.io/component: "postgres"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "netptune-app"
        app.kubernetes.io/component: "postgres"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - image: "docker.io/library/postgres:18"
          name: "postgres"
          env:
            - name: "PGDATA"
              value: "/var/lib/postgresql/data/pgdata"
          envFrom:
            - configMapRef:
                name: "postgres-config"
            - secretRef:
                name: "postgres-secrets"
          ports:
            - name: "tcp"
              protocol: "TCP"
              containerPort: 5432
          volumeMounts:
            - name: "postgres-data"
              mountPath: "/var/lib/postgresql/data"
          imagePullPolicy: "IfNotPresent"
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Memory only — the node pool has no spare CPU to reserve against.
          resources:
{{- toYaml .Values.parameters.postgres.resources | nindent 12 }}
  updateStrategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 1
  volumeClaimTemplates:
    - metadata:
        name: "postgres-data"
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ .Values.persistence.postgres.size }}"
