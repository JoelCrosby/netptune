---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "server-secrets"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "server"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  # Derived from the infrastructure passwords so each one is entered once.
  ConnectionStrings__netptune: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.postgres.postgres_password }};Database=netptune"
  ConnectionStrings__redis: "cache-service:6379,password={{ .Values.secrets.cache.cache_password }}"
  ConnectionStrings__meilisearch: "Endpoint=http://meilisearch-service:7700/;MasterKey={{ .Values.secrets.meilisearch.master_key }}"
{{- if .Values.aspire.enabled }}
  OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key={{ .Values.secrets.aspire.otlp_api_key }}"
{{- end }}
{{- range $key, $value := .Values.serverSecrets }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
type: "Opaque"
