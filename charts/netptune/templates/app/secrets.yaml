---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "app-secrets"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__cache: "cache-service:6379,password={{ .Values.secrets.app.cache_password }}"
  CACHE_PASSWORD: "{{ .Values.secrets.app.cache_password }}"
  CACHE_URI: "valkey://:{{ .Values.secrets.app.cache_password }}@cache-service:6379"
  REDIS_URL: "cache-service:6379,password={{ .Values.secrets.app.cache_password }}"
  ConnectionStrings__postgresdb: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.app.postgres_password }};Database=netptune"
  POSTGRESDB_PASSWORD: "{{ .Values.secrets.app.postgres_password }}"
  POSTGRESDB_URI: "postgresql://postgres:{{ .Values.secrets.app.postgres_password }}@postgres-service:5432/netptune"
  ConnectionStrings__netptune: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.app.postgres_password }};Database=netptune"
  NETPTUNE_SIGNING_KEY: "{{ .Values.secrets.app.signing_key }}"
  NETPTUNE_GITHUB_CLIENT_ID: "{{ .Values.secrets.app.github_client_id }}"
  NETPTUNE_GITHUB_SECRET: "{{ .Values.secrets.app.github_secret }}"
  NETPTUNE_GITHUB_CALLBACK: "{{ .Values.secrets.app.github_callback }}"
  NETPTUNE_GOOGLE_CLIENT_ID: "{{ .Values.secrets.app.google_client_id }}"
  NETPTUNE_GOOGLE_SECRET: "{{ .Values.secrets.app.google_secret }}"
  NETPTUNE_GOOGLE_CALLBACK: "{{ .Values.secrets.app.google_callback }}"
  NETPTUNE_MICROSOFT_CLIENT_ID: "{{ .Values.secrets.app.microsoft_client_id }}"
  NETPTUNE_MICROSOFT_SECRET: "{{ .Values.secrets.app.microsoft_secret }}"
  NETPTUNE_MICROSOFT_CALLBACK: "{{ .Values.secrets.app.microsoft_callback }}"
  SEND_GRID_API_KEY: "{{ .Values.secrets.app.sendgrid_api_key }}"
  NETPTUNE_S3_BUCKET_NAME: "{{ .Values.secrets.app.s3_bucket_name }}"
  NETPTUNE_S3_REGION: "{{ .Values.secrets.app.s3_region }}"
  NETPTUNE_S3_ACCESS_KEY_ID: "{{ .Values.secrets.app.s3_access_key_id }}"
  NETPTUNE_S3_SECRET_ACCESS_KEY: "{{ .Values.secrets.app.s3_secret_access_key }}"
  NETPTUNE_CLOUDFLARE_EMAIL_TOKEN: "{{.Values.secrets.app.cloudflare_email_token }}"
  NETPTUNE_CLOUDFLARE_ACCOUNT_ID: "{{.Values.secrets.app.cloudflare_account_id }}"
  ConnectionStrings__meilisearch: "Endpoint=http://meilisearch-service:7700/;MasterKey={{ .Values.secrets.meilisearch.master_key }}"
{{- if .Values.aspire.enabled }}
  OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key={{ .Values.secrets.aspire.otlp_api_key }}"
{{- end }}
type: "Opaque"
