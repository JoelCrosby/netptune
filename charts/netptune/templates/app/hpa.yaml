{{- if .Values.parameters.app.autoscaling.enabled }}
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "app-hpa"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "app-deployment"
  minReplicas: {{ .Values.parameters.app.autoscaling.minReplicas | int }}
  maxReplicas: {{ .Values.parameters.app.autoscaling.maxReplicas | int }}
  metrics:
    - type: "Resource"
      resource:
        name: "cpu"
        target:
          type: "Utilization"
          averageUtilization: {{ .Values.parameters.app.autoscaling.targetCPUUtilizationPercentage | int }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.parameters.app.autoscaling.scaleUpStabilizationSeconds | int }}
      selectPolicy: "Max"
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.parameters.app.autoscaling.scaleDownStabilizationSeconds | int }}
      selectPolicy: "Max"
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 60
{{- end }}
