---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "client-deployment"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "client"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "netptune-app"
        app.kubernetes.io/component: "client"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "ScheduleAnyway"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: "netptune-app"
              app.kubernetes.io/component: "client"
              app.kubernetes.io/instance: "{{ .Release.Name }}"
      containers:
        - image: "{{ .Values.parameters.client.client_image }}"
          name: "client"
          envFrom:
            - configMapRef:
                name: "client-config"
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: 80
          imagePullPolicy: "Always"
          readinessProbe:
            httpGet:
              # "/" now 302s to the negotiated locale; /healthz is a plain 200 so
              # the probe does not depend on locale routing.
              path: "/healthz"
              port: "http"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
{{- toYaml .Values.parameters.client.resources | nindent 12 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "netptune-app"
      app.kubernetes.io/component: "client"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  replicas: {{ .Values.parameters.client.replicas | int }}
  revisionHistoryLimit: 3
  {{- /* maxSurge 0: at one replica the cluster has no spare CPU for a surge pod, so a
       surge-based rollout cannot schedule. Restore maxSurge 1 once nodes have headroom. */}}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: "RollingUpdate"
