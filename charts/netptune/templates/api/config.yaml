---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "api-config"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "{{ .Values.config.api.ASPNETCORE_FORWARDEDHEADERS_ENABLED }}"
  HTTP_PORTS: "{{ .Values.parameters.api.port_http }}"
  ASPNETCORE_URLS: "{{ .Values.config.api.ASPNETCORE_URLS }}"
  TrustedProxies__ClientAddressHeader: "{{ .Values.trustedProxies.clientAddressHeader }}"
{{- range $index, $network := .Values.trustedProxies.networks }}
  TrustedProxies__Networks__{{ $index }}: "{{ $network }}"
{{- end }}
{{- if .Values.aspire.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard-service:18889"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "{{ .Values.config.api.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}"
  OTEL_SERVICE_NAME: "netptune-api"
{{- end }}
