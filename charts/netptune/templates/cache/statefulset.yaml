---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "cache-statefulset"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "cache"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  serviceName: "cache-service"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "netptune-app"
      app.kubernetes.io/component: "cache"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "netptune-app"
        app.kubernetes.io/component: "cache"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - command:
            - "/bin/sh"
          image: "docker.io/valkey/valkey:9.0"
          name: "cache"
          envFrom:
            - secretRef:
                name: "cache-secrets"
          # This also holds the DataProtection key ring, which is written without a TTL and cannot be
          # regenerated. volatile-lru evicts only keys that have a TTL, so it spares the ring where
          # allkeys-lru would not; appendonly keeps it across a reschedule.
          args:
            - "-c"
            - >-
              valkey-server
              --requirepass $VALKEY_PASSWORD
              --dir /data
              --appendonly yes
              --maxmemory {{ .Values.parameters.cache.maxmemory }}
              --maxmemory-policy volatile-lru
          ports:
            - name: "tcp"
              protocol: "TCP"
              containerPort: 6379
          volumeMounts:
            - name: "cache-data"
              mountPath: "/data"
          imagePullPolicy: "IfNotPresent"
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{- toYaml .Values.parameters.cache.resources | nindent 12 }}
  updateStrategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 1
  volumeClaimTemplates:
    - metadata:
        name: "cache-data"
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ .Values.persistence.cache.size }}"
