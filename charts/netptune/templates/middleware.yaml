---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
{{- $csp := printf "default-src 'self'; script-src 'self' '%s' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://%s; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" .Values.csp.inlineScriptHash .Values.ingress.appHost }}
spec:
  headers:
    customResponseHeaders:
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
{{- if .Values.csp.enforce }}
      Content-Security-Policy: "{{ $csp }}"
{{- else }}
      Content-Security-Policy-Report-Only: "{{ $csp }}"
{{- end }}
---
# The API host serves the generated Scalar docs page, whose inline bootstrap script carries a
# per-request nonce. Only the API can know that value, so it sets Content-Security-Policy itself
# and this middleware carries the remaining headers.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-security-headers
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  headers:
    customResponseHeaders:
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-size-limit
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  buffering:
    maxRequestBodyBytes: 52428800
---
# Compressing a stream withholds it until the buffer fills, so SSE is excluded here and the
# middleware is not attached to the hubs route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  compress:
    minResponseBodyBytes: {{ .Values.parameters.compression.minResponseBodyBytes }}
    excludedContentTypes:
      - "text/event-stream"
