{{- if .Values.networkPolicies.enabled }}
{{- /*
Datastore ingress only, not a namespace-wide default-deny. Clients are matched by release label so a
new service keeps working; postgres also allows the tailscale namespace, which runs the proxy pod
behind postgres-tailscale.
*/}}
{{- range $component := list "postgres" "cache" "nats" "meilisearch" }}
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "{{ $component }}-allow-netptune"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "{{ $component }}"
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "netptune-app"
      app.kubernetes.io/component: "{{ $component }}"
      app.kubernetes.io/instance: "{{ $.Release.Name }}"
  policyTypes:
    - "Ingress"
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: "netptune-app"
              app.kubernetes.io/instance: "{{ $.Release.Name }}"
{{- if eq $component "postgres" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "tailscale"
{{- end }}
{{- end }}
{{- end }}
