---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "jobs-config"
  labels:
    app.kubernetes.io/name: "netptune-app"
    app.kubernetes.io/component: "jobs"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "{{ .Values.config.jobs.ASPNETCORE_FORWARDEDHEADERS_ENABLED }}"
  HTTP_PORTS: "{{ .Values.parameters.jobs.port_http }}"
{{- if .Values.aspire.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard-service:18889"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "{{ .Values.config.jobs.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}"
  OTEL_SERVICE_NAME: "netptune-jobs"
{{- end }}
