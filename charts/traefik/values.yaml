# Values for the upstream Traefik chart, pinned as a dependency in Chart.yaml.
#
# This release is deployed separately from netptune-app, into the traefik namespace:
#
#   helm dependency update charts/traefik/
#   helm upgrade --install traefik charts/traefik/ --namespace traefik
#
# The release name must stay "traefik" — the upstream chart derives resource names
# from it, and renaming would orphan the existing Deployment, Service and LoadBalancer.

traefik:
  # Netptune routes through Gateway API (see charts/netptune/templates/gateway.yaml
  # and httproute.yaml), not through Ingress objects.
  providers:
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false

  # Provisions the Vultr load balancer that Cloudflare treats as the origin.
  #
  # Don't set loadBalancerSourceRanges: the Vultr CCM ignores it. An LB firewall is set with the
  # service.beta.kubernetes.io/vultr-loadbalancer-firewall-rules annotation, whose "cloudflare" source
  # needs no list ("cloudflare,80;cloudflare,443"). It only covers the LB address, though. The NodePorts
  # this service needs also answer on the nodes' public addresses, so the origin is closed by tlsOptions
  # below instead.
  service:
    spec:
      type: LoadBalancer

  # Refuses any TLS connection without Cloudflare's client certificate (Authenticated Origin Pulls),
  # wherever it arrives: the LB or a NodePort, with any SNI or none. Gateway API routers inherit this
  # because they set no options of their own, and the option has to be named "default" for that.
  #
  # Turn on Authenticated Origin Pulls in Cloudflare before deploying this, or every request fails. See
  # "Closing the origin" in DEPLOYMENT.md. The web entrypoint is not covered, but it only serves the
  # https redirect and ACME challenges.
  tlsOptions:
    default:
      clientAuth:
        clientAuthType: RequireAndVerifyClientCert
        secretNames:
          - cloudflare-origin-pull-ca

  # Chart defaults are timeoutSeconds 2 on both probes with readiness failureThreshold 1,
  # so a single slow response pulled Traefik out of the Service endpoints and three killed
  # the container. These values tolerate a busy node without hiding a genuinely dead pod.
  readinessProbe:
    failureThreshold: 3
    timeoutSeconds: 5
  livenessProbe:
    failureThreshold: 5
    timeoutSeconds: 5

  # Without requests the pod is BestEffort, first to be starved on a busy node, which is what turned
  # the slow probes above into a restart loop.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Two replicas, so losing one node or one pod doesn't take the origin down. The spread is soft
  # rather than required anti-affinity: the pool has two nodes, and a required rule would leave the
  # surge pod nowhere to schedule during a rolling update.
  deployment:
    replicas: 2
  topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: '{{ template "traefik.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}-{{ include "traefik.namespace" . }}'
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
