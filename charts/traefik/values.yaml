# Values for the upstream Traefik chart, pinned as a dependency in Chart.yaml.
#
# This release is deployed separately from netptune-app, into the traefik namespace:
#
#   helm dependency update charts/traefik/
#   helm upgrade --install traefik charts/traefik/ --namespace traefik
#
# The release name must stay "traefik" — the upstream chart derives resource names
# from it, and renaming would orphan the existing Deployment, Service and LoadBalancer.

traefik:
  # Netptune routes through Gateway API (see charts/netptune/templates/gateway.yaml
  # and httproute.yaml), not through Ingress objects.
  providers:
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false

  # Provisions the Vultr load balancer that Cloudflare treats as the origin.
  #
  # loadBalancerSourceRanges is deliberately left unset. Restricting the origin to the CDN's published
  # address ranges is the usual advice, and Cloudflare rates it "moderately secure", but the list has
  # to be refreshed by hand whenever those ranges change and a stale list refuses real traffic. That
  # makes continued operation depend on a recurring manual task, which is not a trade worth making
  # here.
  #
  # What that allowlist is usually protecting -- the client address header being believable -- is
  # handled in the application instead, by having the edge stamp a secret only it knows. See
  # trustedProxies in charts/netptune/values.yaml. Nothing in that scheme expires or drifts.
  #
  # Set this if you later want the origin closed at the network layer too, for DDoS and WAF-bypass
  # reasons rather than address-header reasons. The current ranges are at
  # https://www.cloudflare.com/ips, and the list must be reviewed whenever they change.
  service:
    type: LoadBalancer

  # Chart defaults are timeoutSeconds 2 on both probes with readiness failureThreshold 1,
  # so a single slow response pulled Traefik out of the Service endpoints and three killed
  # the container. These values tolerate a busy node without hiding a genuinely dead pod.
  readinessProbe:
    failureThreshold: 3
    timeoutSeconds: 5
  livenessProbe:
    failureThreshold: 5
    timeoutSeconds: 5

  # A second replica is the change that would have prevented the outage entirely, but the
  # current vc2-1c-2gb pool has no node with 100m of unreserved CPU besides the one Traefik
  # is on, so a second pod would sit Pending. Raise this to 2 with required anti-affinity
  # once the cluster moves to larger nodes.
  deployment:
    replicas: 1
